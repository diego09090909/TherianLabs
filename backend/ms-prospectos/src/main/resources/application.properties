spring.application.name=ms-prospectos
server.port=8082

# Base de datos MySQL (esquema propio de este microservicio)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/prospectos_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

eventos.url=${EVENTOS_URL:http://localhost:8081}
